{% extends "base.html" %}
{% block title %}Sign up · Chat App{% endblock %}
{% block content %}
<div class="card">
  <h1>Sign up</h1>

  <form method="post" action="{% url 'signup' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Create account</button>
  </form>

  <p class="muted">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
